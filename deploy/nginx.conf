# Static Vue production on the Russian VPS; Cloudflare DNS only.
server {
    listen 80;
    server_name www.esim-landing.ivanzlobin.com esim-landing.ivanzlobin.com esim-landing-vue.ivanzlobin.com;
    root /var/www/esim-landing-vue/current;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://www.esim-landing.ivanzlobin.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.esim-landing.ivanzlobin.com;
    ssl_certificate /etc/letsencrypt/live/www.esim-landing.ivanzlobin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.esim-landing.ivanzlobin.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:EsimTLS:10m;
    ssl_session_timeout 10m;
    server_tokens off;

    root /var/www/esim-landing-vue/current;
    index index.html;
    access_log /var/log/nginx/esim-landing-vue.access.log;
    error_log /var/log/nginx/esim-landing-vue.error.log;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~ "^/assets/.*-[A-Za-z0-9_-]{8}\.(js|css)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Keep both earlier eSIM addresses working with path and query preserved.
server {
    listen 443 ssl;
    server_name esim-landing.ivanzlobin.com esim-landing-vue.ivanzlobin.com;
    ssl_certificate /etc/letsencrypt/live/www.esim-landing.ivanzlobin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.esim-landing.ivanzlobin.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:EsimTLS:10m;
    ssl_session_timeout 10m;
    server_tokens off;

    return 301 https://www.esim-landing.ivanzlobin.com$request_uri;
}
