<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffbc35"><title>Чип MOV — тест Safari</title>
<style>
*{box-sizing:border-box}html{background:#e44f03;overscroll-behavior:none}body{margin:0;color:white;font:16px/1.4 -apple-system,BlinkMacSystemFont,Arial,sans-serif}.track{height:1300svh}.stage{position:sticky;top:0;height:100svh;background:linear-gradient(180deg,#ffbc35 0%,#e44f03 100%);display:grid;place-items:center;overflow:hidden}.heading{position:absolute;top:max(24px,env(safe-area-inset-top));left:24px;right:24px;text-align:center}.heading h1{font-size:20px;margin:0 0 8px}.heading p{margin:0;font-size:14px;opacity:.9}.media{width:min(78vw,520px);height:min(78vw,520px);position:relative}video,img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}video{opacity:0}.ready video{opacity:1}.ready img{display:none}.controls{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:20px;right:20px;text-align:center}button{border:0;border-radius:40px;background:white;color:#ed5907;padding:14px 24px;font:600 16px -apple-system,BlinkMacSystemFont,Arial,sans-serif}button:disabled{opacity:.7}.diagnostic{font:12px/1.6 ui-monospace,monospace;margin-top:12px;opacity:.85}.progress{width:min(260px,80%);height:2px;background:#ffffff40;margin:12px auto}.fill{height:100%;background:white;transform:scaleX(0);transform-origin:left}select{display:block;max-width:100%;margin:12px auto 0;border:1px solid #ffffff66;border-radius:20px;background:#ffffff18;color:white;padding:8px 12px;font:14px -apple-system,BlinkMacSystemFont,Arial,sans-serif}option{color:#333;background:white}.error{color:white}button[hidden]{display:none}
</style>
</head>
<body><main class="track"><section class="stage">
<header class="heading"><h1>Вращение чипа · MOV</h1><select id="variant" aria-label="Вариант исходника"><option value="chip-v03-hevc-alpha.mov">S020 v03 · HEVC Alpha</option><option value="chip-v03-1-hevc-alpha.mov">S020 v03_1 · HEVC Alpha</option><option value="chip-v02-hevc-alpha.mov">S020 v02 · HEVC Alpha</option></select><p id="status" role="status">Подготавливаю тест…</p></header>
<div class="media" id="media"><img src="poster.webp" alt=""><video id="chip" muted playsinline preload="none" aria-label="Вращающийся чип"></video></div>
<div class="controls"><button id="start" type="button">Начать тест</button><div class="progress"><div class="fill" id="fill"></div></div><div class="diagnostic" id="diagnostic">HEVC MOV · 800×800 · 25 кадров/с</div></div>
</section></main><script type="module">
const video=document.querySelector('#chip'),variant=document.querySelector('#variant'),status=document.querySelector('#status');
const button=document.querySelector('#start'),media=document.querySelector('#media'),diagnostic=document.querySelector('#diagnostic'),fill=document.querySelector('#fill');
let ready=false,pending=0,duration=6,progress=0,frame=0,blobUrl,download,version=0;
video.muted=true;video.defaultMuted=true;
function report(){diagnostic.textContent=`${Math.round(progress*100)}% · цель ${pending.toFixed(2)} c · кадр ${video.currentTime.toFixed(2)} c${video.seeking?' · перемотка':''}`;}
function flush(){if(ready&&!document.hidden&&!video.seeking&&video.readyState>=2&&Math.abs(video.currentTime-pending)>.012)video.currentTime=pending;}
function update(){frame=0;progress=Math.max(0,Math.min(1,scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight)));const phase=progress>=1?1:(progress*4)%1;pending=Math.round(phase*149)/149*Math.max(duration-.04,.001);fill.style.transform=`scaleX(${progress})`;if(ready){flush();report();}}
function schedule(){if(!frame)frame=requestAnimationFrame(update);}
async function prepare(){
 const current=++version;download?.abort();download=new AbortController();
 const controller=download,timer=setTimeout(()=>controller.abort(),60000);
 ready=false;video.pause();video.removeAttribute('src');video.load();if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=undefined;
 media.classList.remove('ready');button.hidden=false;button.disabled=true;button.textContent='Загрузка…';
 status.textContent='Загружаю MOV…';diagnostic.textContent='HEVC Alpha · 800×800 · 25 кадров/с';
 try{
  const response=await fetch(variant.value,{signal:controller.signal,cache:'no-store'});if(!response.ok)throw Error(`Сервер вернул HTTP ${response.status}`);
  const reader=response.body.getReader(),total=Number(response.headers.get('content-length')),chunks=[];let received=0;
  while(true){const {value,done}=await reader.read();if(done)break;chunks.push(value);received+=value.length;if(current!==version)return;status.textContent=`Загружаю MOV: ${total?Math.round(received/total*100)+'%':(received/1048576).toFixed(1)+' МБ'}`;}
  if(current!==version)return;blobUrl=URL.createObjectURL(new Blob(chunks,{type:'video/quicktime'}));video.preload='auto';video.src=blobUrl;video.load();
  button.disabled=false;button.textContent='Начать тест';status.textContent='Видео загружено. Нажмите «Начать тест»';diagnostic.textContent=`${(received/1048576).toFixed(1)} МБ загружено · готово к запуску`;
 }catch(error){if(current!==version)return;status.textContent=error.name==='AbortError'?'Загрузка прервалась. Повторите загрузку':'Не удалось загрузить MOV: '+error.message;button.disabled=false;button.textContent='Повторить загрузку';diagnostic.textContent='Проверьте интернет или выберите другой вариант';}
 finally{clearTimeout(timer);}
}
video.addEventListener('seeked',()=>{flush();if(ready)report();});
video.addEventListener('loadedmetadata',()=>{duration=video.duration||6;schedule();});
video.addEventListener('error',()=>{if(!video.hasAttribute('src'))return;ready=false;media.classList.remove('ready');status.textContent=`Safari не смог декодировать MOV (код ${video.error?.code??'—'})`;button.disabled=false;button.hidden=false;button.textContent='Повторить загрузку';if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=undefined;});
button.addEventListener('click',async()=>{
 if(!blobUrl){prepare();return;}button.disabled=true;status.textContent='Запускаю декодер Safari…';let timer;
 try{
  // Invoke play synchronously inside the tap, after the entire file is ready.
  const playback=video.play();await Promise.race([playback,new Promise((_,reject)=>{timer=setTimeout(()=>reject(Error('Декодер не ответил. Попробуйте ещё раз')),15000);})]);
  video.pause();ready=true;media.classList.add('ready');button.hidden=true;status.textContent='Листайте вниз и обратно · четыре оборота';update();
 }catch(error){video.pause();button.disabled=false;button.hidden=false;status.textContent='Не удалось запустить: '+error.message;button.textContent='Начать тест';}
 finally{clearTimeout(timer);}
});
variant.addEventListener('change',prepare);
addEventListener('scroll',schedule,{passive:true});addEventListener('resize',schedule,{passive:true});addEventListener('pageshow',schedule);document.addEventListener('visibilitychange',()=>{if(!document.hidden)schedule();});
update();prepare();

</script></body></html>
